[build]
command = "npm run build"
publish = "dist"

  [build.environment]
  # Astro 7 needs Node 22.12 or newer.
  NODE_VERSION = "22"

[[headers]]
for = "/*"
  [headers.values]
  X-Content-Type-Options = "nosniff"

# Astro puts a content hash in these file names, so browsers can keep them for good.
[[headers]]
for = "/_astro/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# The comments' frame on giscus.app loads its stylesheet and our fonts from here.
# The stylesheets are open to any origin, so `npm run dev` can use them too.
[[headers]]
for = "/giscus/*"
  [headers.values]
  Access-Control-Allow-Origin = "*"

[[headers]]
for = "/fonts/*"
  [headers.values]
  Access-Control-Allow-Origin = "https://giscus.app"
